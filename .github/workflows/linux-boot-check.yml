name: Linux Boot Check

on:
  push:
    branches:
      - main
      - beta
  pull_request:

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck (kernel domain)
        run: |
          cppcheck --std=c11 --platform=unix64 \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            -Ikernel/include kernel/

  os-tools-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run OS tool smoke
        run: python tools/testkit/aios-testkit.py os

      - name: Upload OS tool artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: os-tool-artifacts-${{ matrix.os }}
          path: |
            kernel/build/tool-smoke/summary.json
            kernel/build/tool-smoke/static-chaos-score.json
            kernel/build/tool-smoke/memory_journal.jsonl
            kernel/build/tool-smoke/adapter_candidates.jsonl
          if-no-files-found: warn

  build-and-boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run testkit host unit tests
        run: python -m unittest discover -s tools/testkit/tests -t tools/testkit -p "test_*.py" -v

      - name: Run PowerShell verdict selftest
        shell: pwsh
        run: ./tools/testkit/tests/test_build_windows_verdict.ps1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            gcc \
            binutils \
            qemu-system-x86 \
            grub-pc-bin \
            xorriso \
            mtools

      - name: Run all-in-one kernel + OS smoke
        run: python tools/testkit/aios-testkit.py all --strict

      - name: Run interactive shell lane
        run: python tools/testkit/aios-testkit.py shell --strict --skip-build

      - name: Run boot inventory (all profiles + structural drift)
        run: python tools/testkit/aios-testkit.py boot-inventory --profiles full minimal storage-only --strict

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-boot-artifacts
          path: |
            kernel/build/aios-kernel.bin
            kernel/build/aios-kernel.iso
            kernel/build/serial_output.log
            kernel/build/shell-smoke/transcript.log
            kernel/build/shell-smoke/summary.json
            kernel/build/boot-matrix/summary.json
            kernel/build/boot-inventory/summary.json
            kernel/build/tool-smoke/summary.json
            kernel/build/tool-smoke/static-chaos-score.json
            kernel/build/tool-smoke/memory_journal.jsonl
            kernel/build/tool-smoke/adapter_candidates.jsonl
          if-no-files-found: warn
